CONFIG_ZMK_HID_INDICATORS=y
CONFIG_GPIO=y
CONFIG_LED=y
CONFIG_LED_GPIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_DEVICE_NAME="Majestouch C2"
# Improve BLE pairing/connection reliability on Windows: allows a fresh pairing
# request to overwrite an existing bond (fixes "try to connect again" after a
# reflash) and applies the experimental connection params (2M PHY off).
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

CONFIG_ZMK_EXT_POWER=n
